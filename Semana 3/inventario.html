<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Librería Épica</title>
    <!-- Mantenemos Bootstrap para el diseño rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script>
        // 1. Objeto API Falsa (Simulando la base de datos de la librería)[cite: 7, 8]
        const apiLibros = {
            "status": 200,
            "message": "Grimorios Obtenidos",
            "data": [
                {"id": "1", "nombre": "El Señor de los Anillos"},
                {"id": "2", "nombre": "El Archivo de las Tormentas"}
            ]
        };

        // 2. EVENTO BROWSER: Esta función corre automáticamente al cargar la página[cite: 8, 10]
        const cargarLibros = () => {
            let combo = document.getElementById("cmbLibros"); // Capturamos el Select HTML[cite: 8]
            
            // Recorremos los datos usando una función flecha de ES6+[cite: 7, 11]
            apiLibros.data.forEach((libro) => {
                let opcion = document.createElement("option"); // Manipulación del DOM
                opcion.setAttribute("value", libro.id); // Asignamos atributos
                opcion.innerText = libro.nombre;
                combo.appendChild(opcion); // Insertamos la opción en la página[cite: 8]
            });
        };

        // 3. EVENTO INTERACTION: Esta función corre al hacer clic en el botón[cite: 9, 10]
        const agregarNuevoLibro = () => {
            let combo = document.getElementById("cmbLibros");
            let idIngresado = document.getElementById("txtId").value; // Leemos el Input[cite: 9]
            let nombreIngresado = document.getElementById("txtNombre").value;

            // COMPOSICIÓN DE OBJETOS: Creamos un objeto base genérico
            const caracteristicasBase = { estado: "Nuevo", tipo: "Fantasía Épica" };
            
            // Creamos un objeto con lo que el usuario escribió
            const datosUsuario = { id: idIngresado, nombre: nombreIngresado };
            
            // Verdadera Composición (Fusión) usando el Spread Operator (...) de ES6+[cite: 6]
            // Aquí evitamos repetir atributos uniendo los dos objetos en uno solo[cite: 6]
            const nuevoLibroCompuesto = { ...caracteristicasBase, ...datosUsuario };
            console.log("Nuevo objeto compuesto en memoria:", nuevoLibroCompuesto);

            // Manipulamos el DOM para agregar este nuevo libro compuesto al Select[cite: 9]
            let nuevaOpcion = document.createElement("option");
            nuevaOpcion.setAttribute("value", nuevoLibroCompuesto.id);
            nuevaOpcion.innerText = nuevoLibroCompuesto.nombre;
            combo.appendChild(nuevaOpcion); // Lo agregamos visualmente[cite: 9]
        };
    </script>
</head>

<!-- El evento 'onload' gatilla la carga inicial apenas abre el navegador[cite: 8] -->
<body class="bg-dark p-5" onload="cargarLibros();">
    <div class="container bg-light p-4 rounded shadow-lg">
        <h2 class="text-primary mb-4">Gestión de Inventario Épico</h2>
        
        <!-- Elemento a manipular visualmente -->
        <div class="mb-4">
            <label class="form-label fw-bold">Grimorios Actuales en la Biblioteca:</label>
            <select id="cmbLibros" class="form-select border-primary"></select>
        </div>

        <hr>
        
        <!-- Entradas del usuario (I/O)[cite: 10] -->
        <h4 class="mt-4 mb-3">Añadir Nuevo Pergamino / Libro</h4>
        <div class="row">
            <div class="col-md-3 mb-2">
                <input id="txtId" type="text" class="form-control" placeholder="ID (Ej: 3)" />
            </div>
            <div class="col-md-6 mb-2">
                <input id="txtNombre" type="text" class="form-control" placeholder="Título de la Obra" />
            </div>
            <div class="col-md-3 mb-2">
                <!-- El evento 'onclick' reacciona a la interacción del usuario[cite: 9] -->
                <button type="button" class="btn btn-primary w-100 fw-bold" onclick="agregarNuevoLibro();">Agregar a la Lista</button>
            </div>
        </div>
    </div>
</body>
</html>
